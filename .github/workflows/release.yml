# Tag and publish a GitHub Release when a merge to main changes the plugin.json version.
# Run it by hand from the Actions tab to publish a version that is not released yet.
name: Release

on:
  push:
    branches: [main]
    paths: [plugins/gleaner/.claude-plugin/plugin.json]
  workflow_dispatch:

permissions:
  contents: write
  # Dispatching auto-release.yml after a release, below.
  actions: write

# No concurrency group: a group keeps only one pending run, which would skip a version merged mid-run.
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # History, to tag the commit that set the version rather than whatever main has reached since.
          fetch-depth: 0
      - name: Publish the plugin.json version
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./plugins/gleaner/.claude-plugin/plugin.json').version")
          if gh release view "v$version" > /dev/null 2>&1; then
            echo "v$version is already released."
            exit 0
          fi
          node scripts/release-notes.mjs "$version" > "$RUNNER_TEMP/notes.md"
          # An auto release dispatches this run after its push, so main may already hold a later PR: tag the version commit.
          target=$(git log -1 --format=%H -G'"version":' -- plugins/gleaner/.claude-plugin/plugin.json)
          gh release create "v$version" --target "$target" --title "Gleaner $version" --notes-file "$RUNNER_TEMP/notes.md"
          echo "released=true" >> "$GITHUB_OUTPUT"
      # A plugin PR merged while this version waited for its tag found no tag and released nothing, so look again now.
      - name: Release plugin changes merged since
        if: steps.publish.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run auto-release.yml --repo "$GITHUB_REPOSITORY" --ref main
      # The Gleaner site reads its changelog from these releases at build time, so a new release rebuilds it.
      - name: Rebuild the Gleaner site
        if: steps.publish.outputs.released == 'true'
        env:
          NETLIFY_BUILD_HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
        run: |
          if [ -z "$NETLIFY_BUILD_HOOK" ]; then
            echo "::notice::NETLIFY_BUILD_HOOK is not set, so the site was not rebuilt."
            exit 0
          fi
          # A re-run skips this step once the release exists, so retry here instead.
          curl --fail-with-body --silent --show-error --retry 3 --request POST --data '{}' "$NETLIFY_BUILD_HOOK" || {
            echo "::error::The site was not rebuilt. Re-running this job will not retry it, because the release already exists; trigger a deploy in Netlify instead."
            exit 1
          }
